name: Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Publishing by pushing a branch only needs write access to the repo contents.
# The pages/id-token permissions belonged to the github-pages environment flow.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      # Pages serves this branch as-is, so the built files become the site root.
      # .nojekyll stops Jekyll from dropping the _-prefixed files Vite emits.
      - name: Publish dist to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
